name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make clean all test
      - run: make sanitize

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make format-check
